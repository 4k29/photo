<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mark — Photo studio</title><meta name="description" content="写真にサインと撮影情報を。透かし、余白フレーム、コラージュを端末内で作るフォトエディター。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23222523'/%3E%3Cpath d='M8 24V8l8 10 8-10v16' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E"><link rel="stylesheet" href="./style.css"><script src="./app.js" defer></script></head>
<body><header><a class="brand" href="./">Mark<span>Photo studio</span></a><button class="primary" id="download" disabled>画像を保存 <span aria-hidden="true">↗</span></button></header>
<main><section class="workspace"><div class="toolbar"><div class="segmented" aria-label="編集モード"><button data-mode="single" aria-pressed="true">透かし・フレーム</button><button data-mode="collage" aria-pressed="false">コラージュ</button></div><span id="dimensions">写真を選んでください</span></div>
<div id="stage"><canvas id="preview" aria-label="編集した写真のプレビュー"></canvas><div id="empty"><div class="empty-symbol" aria-hidden="true">＋</div><h1>写真を、ひとつの作品に。</h1><p>サインを添えたり、余白を整えたり。<br>数枚を並べて、一枚のコラージュにも。</p><button class="primary" id="choose">写真を選ぶ</button><small>JPEG・PNG・WebP・HEIC / 最大6枚</small></div></div>
<div class="filmbar"><div><span id="count">0 / 6</span><button id="add" class="text-button">＋ 写真を追加</button></div><small>写真は端末内で処理されます</small></div><div id="photos" class="photos" aria-label="写真の選択と並べ替え"></div><p id="status" role="status" aria-live="polite"></p></section>
<aside><section id="singleControls" class="panel"><h2>仕上げ</h2><div class="style-grid"><button data-style="minimal" aria-pressed="false"><b>Aa</b><span>ミニマル</span></button><button data-style="editorial" aria-pressed="false"><b class="serif">Aa</b><span>エディトリアル</span></button><button data-style="frame" aria-pressed="true"><b class="frame-icon">Aa</b><span>ギャラリー</span></button><button data-style="label" aria-pressed="false"><b>│ Aa</b><span>ラベル</span></button><button data-style="vertical" aria-pressed="false"><b class="vertical-icon">Aa</b><span>縦組み</span></button><button data-style="corners" aria-pressed="false"><b>⌜ Aa ⌟</b><span>四隅マーク</span></button><button data-style="center" aria-pressed="false"><b>— Aa —</b><span>中央サイン</span></button><button data-style="film" aria-pressed="false"><b class="film-icon">Aa</b><span>フィルム帯</span></button><button data-style="dot" aria-pressed="false"><b class="mono">· A ·</b><span>ドット</span></button></div></section>
<section id="collageControls" class="panel" hidden><h2>レイアウト</h2><div class="layout-grid"><button data-layout="grid" aria-pressed="true"><i class="layout grid-icon"><em></em><em></em><em></em><em></em></i><span>グリッド</span></button><button data-layout="triptych" aria-pressed="false"><i class="layout three-icon"><em></em><em></em><em></em></i><span>トリプティック</span></button><button data-layout="editorial" aria-pressed="false"><i class="layout editorial-icon"><em></em><em></em><em></em></i><span>マガジン</span></button><button data-layout="stack" aria-pressed="false"><i class="layout stack-icon"><em></em><em></em></i><span>縦並び</span></button><button data-layout="contact" aria-pressed="false"><i class="layout contact-icon"><em></em><em></em><em></em><em></em><em></em><em></em></i><span>コンタクト</span></button></div><div class="row"><div><label for="aspect">縦横比</label><select id="aspect"><option value="0.8">4 : 5</option><option value="1">1 : 1</option><option value="1.5">3 : 2</option><option value="0.5625">9 : 16</option></select></div><div><label for="resolution">長辺</label><select id="resolution"><option value="2000">2,000 px</option><option value="3000" selected>3,000 px</option><option value="4000">4,000 px</option></select></div></div><label for="gap">写真の間隔 <output id="gapValue">2%</output></label><input id="gap" type="range" min="0" max="8" value="2" step="0.5"><label for="fit">写真の収め方</label><select id="fit"><option value="contain">写真全体を表示</option><option value="cover">枠いっぱいにトリミング</option></select><div id="cropControls" hidden><p class="hint">選択中の写真の切り取り位置</p><label for="focalX">左右 <output id="focalXValue">50%</output></label><input id="focalX" type="range" min="0" max="100" value="50"><label for="focalY">上下 <output id="focalYValue">50%</output></label><input id="focalY" type="range" min="0" max="100" value="50"></div></section>
<section class="panel"><h2>サイン</h2><label for="signature">名前・タイトル</label><input id="signature" type="text" value="" placeholder="Your name / Collection title" maxlength="64"><label for="detail">ひとこと</label><input id="detail" type="text" placeholder="A quiet afternoon" maxlength="120"><div class="row"><div><label for="font">書体</label><select id="font"><option value="sans">サンセリフ</option><option value="serif" selected>セリフ</option><option value="italic">イタリック</option><option value="mono">等幅</option></select></div><div id="positionControl"><label for="position">位置</label><select id="position"><option value="bl">左下</option><option value="br">右下</option><option value="tl">左上</option><option value="tr">右上</option></select></div></div><label for="size">文字サイズ <output id="sizeValue">3%</output></label><input id="size" type="range" min="1" max="8" value="3" step="0.5"><label for="opacity">不透明度 <output id="opacityValue">90%</output></label><input id="opacity" type="range" min="10" max="100" value="90"></section>
<section class="panel"><div class="section-heading"><h2>撮影情報</h2><label class="check"><input id="autoExif" type="checkbox" checked> EXIFを表示</label></div><p id="exifStatus" class="hint">写真から自動で読み取ります。</p><dl id="exifData"></dl><div class="checks"><label class="check"><input id="showCamera" type="checkbox" checked> 機種</label><label class="check"><input id="showLens" type="checkbox"> レンズ</label><label class="check"><input id="showExposure" type="checkbox" checked> 撮影設定</label><label class="check"><input id="showDate" type="checkbox"> 撮影日時</label></div><p class="hint">コラージュでは、それぞれの写真に表示します。</p></section>
<section class="panel"><h2>色と余白</h2><div class="row"><div><label for="background">背景色</label><input id="background" type="color" value="#ffffff"></div><div><label for="color">文字色</label><select id="color"><option value="auto">自動</option><option value="white">ホワイト</option><option value="black">ブラック</option></select></div></div><label for="margin">余白 <output id="marginValue">5%</output></label><input id="margin" type="range" min="2" max="15" value="5" step="0.5"></section>
<section class="panel last"><h2>保存</h2><label for="format">ファイル形式</label><select id="format"><option value="image/jpeg">JPEG / 高画質</option><option value="image/png">PNG</option></select><p id="exportHint" class="hint">1枚の写真は元の解像度で保存。フレームは外側に追加します。</p><p class="hint">HEICもJPEG／PNGで保存します。</p></section></aside></main><input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.heic,.heif" multiple hidden></body></html>
