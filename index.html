<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MARK — Photo watermark</title><meta name="description" content="ドット文字と余白で、写真に自分のサインを。端末内で使える透かしエディター。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Cpath d='M8 24V8l8 10 8-10v16' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E"><style>
*{box-sizing:border-box}body{margin:0;background:#f2f2f0;color:#171717;font:16px -apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{height:90px;padding:0 4vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d2d2cf}.brand{font:700 30px monospace;letter-spacing:5px}.tag{font:12px monospace;letter-spacing:2px;color:#686865}main{display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:calc(100vh - 90px)}.workspace{padding:32px 4vw;display:flex;flex-direction:column;min-width:0}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:24px;font:12px monospace;color:#666}.topline span:first-child{color:#222}#stage{background:#dededb;border:1px solid #d0d0cc;flex:1;min-height:440px;display:flex;align-items:center;justify-content:center;padding:32px;position:relative;overflow:hidden}#stage.drag{outline:2px solid #dc302b;outline-offset:-4px}canvas{display:block;max-width:100%;max-height:65vh;width:auto;height:auto;box-shadow:0 18px 40px #0002}#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#e8e8e5;text-align:center;padding:20px}.plus{font:300 64px monospace;margin-bottom:16px;color:#777}.empty-title{font-size:22px;margin-bottom:12px}.hint{font-size:13px;color:#6c6c68;line-height:1.8;margin:14px 0}.primary{background:#171717;color:white;border:0;border-radius:28px;padding:14px 25px}.primary:hover{background:#353535}.primary:disabled{opacity:.35;cursor:default}.red{background:#d9322b}.red:hover{background:#ba251f}.below{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:18px}.quiet{background:none;border:0;text-decoration:underline;text-underline-offset:4px;padding:8px 0;font-size:14px}.privacy{font-size:12px;color:#676763}aside{border-left:1px solid #d2d2cf;padding:30px 26px;background:#fafaf8}.section{padding-bottom:25px;margin-bottom:24px;border-bottom:1px solid #ddd}.section-title{font:12px monospace;color:#777;letter-spacing:1.5px;margin-bottom:18px}.presets{display:grid;gap:8px}.preset{text-align:left;background:transparent;border:1px solid #d5d5d1;border-radius:6px;padding:13px 14px;display:flex;justify-content:space-between;align-items:center;font:14px monospace}.preset[aria-pressed=true]{background:#171717;color:#fff;border-color:#171717}.preset small{font:12px -apple-system,sans-serif;opacity:.65}label{display:block;font-size:14px;margin:16px 0 8px}input[type=text],select{width:100%;padding:11px 12px;border:1px solid #d5d5d1;border-radius:5px;background:#fff;color:#171717;min-height:44px}input[type=range]{width:100%;accent-color:#222}output{float:right;font:12px monospace}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}#download{width:100%}#status{font-size:13px;line-height:1.7;min-height:24px;color:#575753}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #d9322b;outline-offset:3px}.foot{font:12px monospace;color:#888;letter-spacing:1px;margin-top:20px}@media(max-width:800px){header{height:72px}.tag{letter-spacing:0}main{grid-template-columns:1fr}.workspace{padding:20px}#stage{min-height:360px;padding:18px}aside{border-left:0;border-top:1px solid #d2d2cf;padding:24px}.presets{grid-template-columns:repeat(3,1fr)}.preset{display:block;font-size:12px}.preset small{display:block;margin-top:8px}canvas{max-height:65vh}.privacy{max-width:220px}.brand{font-size:24px}}
</style><header><div class="brand">MARK<span style="color:#d9322b">( )</span></div><div class="tag">PHOTO WATERMARK / 01</div></header><main><section class="workspace"><div class="topline"><span>YOUR PHOTO. YOUR MARK.</span><span id="dimensions">NO IMAGE</span></div><div id="stage"><canvas id="preview" aria-label="透かしを加えた写真のプレビュー"></canvas><div id="empty"><div class="plus">＋</div><div class="empty-title">写真に、サインを。</div><p class="hint">写真をここにドロップ<br>または、ファイルから選択</p><button class="primary" id="choose">写真を選ぶ</button><p class="hint">JPEG / PNG / WebP / HEIC</p></div></div><div class="below"><button class="quiet" id="replace">写真を変更</button><span class="privacy">写真はアップロードされず、端末内で処理されます。</span></div><div id="status" role="status" aria-live="polite"></div></section><aside><div class="section"><div class="section-title">01 / STYLE</div><div class="presets"><button class="preset" data-style="dot" aria-pressed="true">DOT SIGN<small>ドット文字</small></button><button class="preset" data-style="label" aria-pressed="false">TECH LABEL<small>撮影情報</small></button><button class="preset" data-style="frame" aria-pressed="false">FRAME<small>余白フレーム</small></button><button class="preset" data-style="vertical" aria-pressed="false">VERTICAL<small>縦組み</small></button><button class="preset" data-style="corners" aria-pressed="false">VIEWFINDER<small>四隅のマーク</small></button><button class="preset" data-style="center" aria-pressed="false">CENTER<small>中央のサイン</small></button><button class="preset" data-style="film" aria-pressed="false">FILM STRIP<small>フィルム風の帯</small></button></div></div><div class="section"><div class="section-title">02 / SIGNATURE</div><label for="signature">名前・サイン</label><input id="signature" type="text" value="SHOT BY YOU" maxlength="64" autocomplete="off"><label for="detail">サブテキスト・撮影情報</label><input id="detail" type="text" placeholder="TOKYO / 35MM / F1.8" maxlength="100" autocomplete="off"><div class="row"><div><label for="position">位置</label><select id="position"><option value="bl">左下</option><option value="br">右下</option><option value="tl">左上</option><option value="tr">右上</option></select></div><div><label for="color">カラー</label><select id="color"><option value="white">ホワイト</option><option value="black">ブラック</option></select></div></div><label for="size">サイズ <output id="sizeValue">5%</output></label><input id="size" type="range" min="2" max="12" value="5"><label for="opacity">不透明度 <output id="opacityValue">85%</output></label><input id="opacity" type="range" min="10" max="100" value="85"><label for="margin">余白 <output id="marginValue">5%</output></label><input id="margin" type="range" min="2" max="15" value="5"></div><div class="section-title">03 / EXPORT</div><label for="format">ファイル形式</label><select id="format"><option value="image/jpeg">JPEG / 高画質</option><option value="image/png">PNG / 透過を保持</option></select><p class="hint">元の写真の解像度で保存します。<br>フレームとフィルム帯は写真の外側に追加。HEICもJPEG／PNGで保存します。</p><button class="primary red" id="download" disabled>画像を書き出す ↓</button><div class="foot">MADE TO LEAVE A MARK.</div></aside></main><input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.heic,.heif" hidden><script>
'use strict';
const $=id=>document.getElementById(id), cv=$('preview');let photo=null,style='dot',filename='photo',loadId=0,busy=false;
function settings(){return {signature:$('signature').value,detail:$('detail').value,position:$('position').value,color:$('color').value,size:+$('size').value/100,opacity:+$('opacity').value/100,margin:+$('margin').value/100}}
function dotText(text,height,color){const step=5,c=document.createElement('canvas'),x=c.getContext('2d');x.font='bold 70px monospace';c.width=Math.max(1,Math.ceil(x.measureText(text).width+8));c.height=90;x.font='bold 70px monospace';x.fillText(text,4,70);const data=x.getImageData(0,0,c.width,c.height).data;const out=document.createElement('canvas');out.width=c.width;out.height=c.height;const o=out.getContext('2d');o.fillStyle=color;for(let y=2;y<c.height;y+=step)for(let xx=2;xx<c.width;xx+=step){if(data[(y*c.width+xx)*4+3]>90){o.beginPath();o.arc(xx,y,1.7,0,Math.PI*2);o.fill()}}return {canvas:out,width:out.width*height/90,height};}
function render(target,preview=false){
 if(!photo)return;
 const s=settings(),w=photo.naturalWidth,h=photo.naturalHeight,base=Math.min(w,h),pad=base*s.margin,fs=base*s.size;
 const framed=style==='frame'||style==='film',band=framed?Math.max(fs*3.6,pad*2+fs*1.5):0;
 const scale=preview?Math.min(1,1600/Math.max(w,h+band)):1;
 target.width=Math.round(w*scale);target.height=Math.round((h+band)*scale);
 const x=target.getContext('2d');x.scale(scale,scale);
 if($('format').value==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,w,h+band)}
 x.drawImage(photo,0,0,w,h);
 let ink=s.color==='white'?'#fff':'#111';
 if(framed){x.fillStyle=style==='film'?'#111':s.color==='white'?'#fff':'#111';x.fillRect(0,h,w,band);ink=style==='film'?'#eee':s.color==='white'?'#111':'#fff'}
 x.save();x.globalAlpha=s.opacity;x.fillStyle=ink;x.strokeStyle=ink;
 if(style==='corners'){
  const len=base*.035;x.lineWidth=Math.max(1,base*.0015);
  for(const [cx,cy,dx,dy] of [[pad,pad,1,1],[w-pad,pad,-1,1],[pad,h-pad,1,-1],[w-pad,h-pad,-1,-1]]){x.beginPath();x.moveTo(cx+dx*len,cy);x.lineTo(cx,cy);x.lineTo(cx,cy+dy*len);x.stroke()}
 }
 if(style==='film'){
  const hole=base*.01,gap=hole*2.4;x.fillStyle='#e4e4df';
  for(let xx=gap;xx<w-gap;xx+=gap){x.fillRect(xx,h+hole,hole,hole);x.fillRect(xx,h+band-hole*2,hole,hole)}x.fillStyle=ink;
 }
 const sig=s.signature.trim(),sub=s.detail.trim(),mark=dotText(sig,fs*1.4,ink),subsize=fs*.36;
 x.font=subsize+'px monospace';
 const textW=Math.max(sig?mark.width:0,x.measureText(sub).width,1),textH=(sig?fs*1.4:0)+(sub?fs*.64:0);
 const inset=style==='corners'?base*.055:0,extra=style==='label'?fs*.4:0;
 const limitW=style==='vertical'?h-2*pad:w-2*(pad+inset);
 const limitH=style==='vertical'?w-2*pad:framed?band-base*.05:h-2*(pad+inset);
 const fit=Math.min(1,limitW/(textW+extra),limitH/Math.max(textH,1)),bw=(textW+extra)*fit,bh=textH*fit;
 let left=s.position.endsWith('r')?w-pad-inset-bw:pad+inset;
 let top=framed?h+(band-bh)/2:s.position.startsWith('t')?pad+inset:h-pad-inset-bh;
 if(style==='center'){left=(w-bw)/2;top=(h-bh)/2}
 if(style==='vertical'){
  left=s.position.endsWith('r')?w-pad-bh:pad;top=s.position.startsWith('t')?pad:h-pad-bw;
  x.translate(left,top+bw);x.rotate(-Math.PI/2);
 }else x.translate(left,top);
 x.scale(fit,fit);
 if(style==='label'){x.fillRect(0,0,Math.max(1,fs*.045),textH);x.translate(extra,0)}
 if(sig)x.drawImage(mark.canvas,0,0,mark.width,mark.height);
 if(sub){x.fillStyle=ink;x.font=subsize+'px monospace';x.textBaseline='top';x.fillText(sub,0,sig?fs*1.5:0)}
 x.restore();return {width:w,height:Math.round(h+band)};
}
function update(){for(const id of ['size','opacity','margin'])$(id+'Value').value=$(id).value+'%';const d=render(cv,true);if(d)$('dimensions').textContent=d.width+' × '+d.height+' PX';}
let decoderPromise;
function loadHeicDecoder(){
 if(typeof window.HeicTo==='function')return Promise.resolve(window.HeicTo);
 if(!decoderPromise)decoderPromise=new Promise((resolve,reject)=>{
  const script=document.createElement('script');let timer;
  const fail=()=>{clearTimeout(timer);script.remove();reject(new Error('decoder'))};
  script.src='https://cdn.jsdelivr.net/npm/heic-to@1.5.2/dist/iife/heic-to.js';
  script.onload=()=>{clearTimeout(timer);typeof window.HeicTo==='function'?resolve(window.HeicTo):fail()};
  script.onerror=fail;timer=setTimeout(fail,30000);document.head.append(script);
 }).catch(e=>{decoderPromise=null;throw e});
 return decoderPromise;
}
async function decodeImage(blob){
 const url=URL.createObjectURL(blob),im=new Image();
 try{im.src=url;await im.decode();return im}finally{URL.revokeObjectURL(url)}
}
async function isHeicFile(file){
 if(/\.hei[cf]$/i.test(file.name)||/^image\/(heic|heif)(-sequence)?$/i.test(file.type))return true;
 const bytes=new Uint8Array(await file.slice(0,64).arrayBuffer());
 const text=String.fromCharCode(...bytes);
 return text.slice(4,8)==='ftyp'&&/heic|heix|hevc|hevx|mif1|msf1/.test(text.slice(8));
}
async function openFile(file){
 if(!file)return;const id=++loadId;
 if(file.size>80*1024*1024){$('status').textContent='80MB以下の写真を選んでください。';return}
 $('status').textContent='写真を読み込んでいます…';
 try{
  const heic=await isHeicFile(file);if(id!==loadId)return;
  if(!heic&&!['image/jpeg','image/png','image/webp'].includes(file.type)&&!(/\.(jpe?g|png|webp)$/i.test(file.name)))throw Error('format');
  let im;
  try{im=await decodeImage(file)}catch(e){
   if(!heic)throw e;if(id!==loadId)return;
   $('status').textContent='HEICを変換しています。大きい写真は時間がかかります…';
   const convert=await loadHeicDecoder();if(id!==loadId)return;
   const png=await convert({blob:file,type:'image/png'});if(id!==loadId)return;
   im=await decodeImage(png);
  }
  if(id!==loadId)return;
  if(im.naturalWidth*im.naturalHeight>65000000)throw Error('large');
  photo=im;filename=file.name.replace(/\.[^.]+$/,'');$('empty').style.display='none';$('download').disabled=false;update();
  $('status').textContent=heic?'HEICを読み込みました。保存形式はJPEGまたはPNGです。':'';
 }catch(e){if(id===loadId)$('status').textContent=e.message==='large'?'6500万画素以下の写真を選んでください。':e.message==='format'?'JPEG・PNG・WebP・HEICの写真を選んでください。':e.message==='decoder'?'HEIC変換機能を取得できませんでした。接続を確認して、もう一度写真を選んでください。':'写真を読み込めませんでした。破損していない別の写真を試してください。'}
}
$('choose').onclick=$('replace').onclick=()=>{$('file').value='';$('file').click()};$('file').onchange=e=>openFile(e.target.files[0]);document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{style=b.dataset.style;document.querySelectorAll('[data-style]').forEach(t=>t.setAttribute('aria-pressed',String(t===b)));$('position').disabled=style==='center';$('position').options[2].disabled=$('position').options[3].disabled=['frame','film'].includes(style);if(['frame','film'].includes(style)&&$('position').value.startsWith('t'))$('position').value='b'+$('position').value[1];update()});document.querySelectorAll('aside input,aside select').forEach(el=>el.addEventListener('input',update));const stage=$('stage');stage.addEventListener('dragover',e=>{e.preventDefault();stage.classList.add('drag')});stage.addEventListener('dragleave',()=>stage.classList.remove('drag'));stage.addEventListener('drop',e=>{e.preventDefault();stage.classList.remove('drag');openFile(e.dataTransfer.files[0])});
$('download').onclick=async()=>{if(!photo||busy)return;busy=true;$('download').disabled=true;$('status').textContent='書き出しています…';const c=document.createElement('canvas');try{const mime=$('format').value;render(c);const blob=await new Promise(resolve=>c.toBlob(resolve,mime,.96));if(!blob)throw Error();const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename+'-mark.'+(mime==='image/png'?'png':'jpg');document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);$('status').textContent='画像を書き出しました。';}catch{$('status').textContent='書き出せませんでした。小さい写真で試してください。'}finally{c.width=c.height=1;busy=false;$('download').disabled=!photo}};
</script></html>
