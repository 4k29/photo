name: Publish photo editor
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare static site
        run: |
          mkdir -p _site/vendor
          cp index.html style.css app.js _site/
          curl -fSL --retry 2 https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js -o _site/vendor/exifr.js
          curl -fSL --retry 2 https://cdn.jsdelivr.net/npm/heic-to@1.5.2/dist/iife/heic-to.js -o _site/vendor/heic-to.js
          curl -fSL --retry 2 https://cdn.jsdelivr.net/npm/exifr@7.1.3/LICENSE -o _site/vendor/exifr-LICENSE.txt
          curl -fSL --retry 2 https://cdn.jsdelivr.net/npm/heic-to@1.5.2/LICENSE -o _site/vendor/heic-to-LICENSE.txt
          node --check app.js
      - name: Install browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/photo-browser" playwright@1.51.1 --no-package-lock --ignore-scripts
          node "$RUNNER_TEMP/photo-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify editing and exports in browser
        env:
          NODE_PATH: ${{ runner.temp }}/photo-browser/node_modules
        run: node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-previews
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
